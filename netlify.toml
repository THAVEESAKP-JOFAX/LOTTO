# Deploy ทำผ่าน `npm run deploy` เท่านั้น (มีขั้นยืนยันก่อน deploy ทุกครั้ง)
# ห้ามเปิด auto-deploy จาก Git ใน Netlify UI เพื่อไม่ให้ deploy โดยไม่ได้ยืนยัน
[build]
  command = "npm test && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
